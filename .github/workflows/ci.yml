name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build and test
        run: ./gradlew build
      - name: Replay the recorded findings on every engine
        run: |
          for f in findings/*.sql; do
            ./gradlew -q :assay-cli:run --args="check --out runs/$(basename "$f" .sql) --file $f --engines comet,velox"
          done
      - name: Small fuzz run against the control
        run: ./gradlew -q :assay-cli:run --args="--out runs/smoke --seed 1 --queries 20 --rows 50 --engines spark-interpreted --max-shrinks 2"
